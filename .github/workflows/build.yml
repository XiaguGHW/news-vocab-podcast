name: build podcast

on:
  push:
    branches: [main]
    paths:
      - "episodes/**"
      - "stories/**"
      - "reviews/**"
      - "assets/review/**"
      - "assets/episodes/**"
      - "episode_assets.py"
      - "check_episode.py"
      - "tests/test_illustrations.py"
      - "build_review.py"
      - "review_podcast.py"
      - "build_story.py"
      - "story_podcast.py"
      - "sync_podcast_vocabulary.py"
      - "tests/test_podcast_sync.py"
      - "build.py"
      - "video.py"
      - "fonts/**"
      - "cover.png"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            ( curl -fsSL -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              && mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1 \
              && echo "/tmp/ff/bin" >> "$GITHUB_PATH" ) \
            || ( sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg )
          fi

      - name: Install Python packages
        run: pip install -q edge-tts pillow fonttools

      - name: Check episode scripts
        run: python check_episode.py

      - name: Test media tools
        run: python -m unittest discover -s tests -p 'test_*.py'

      - uses: actions/cache@v4
        with:
          path: |
            .cache/story-tts
            .cache/review-tts
          key: ${{ runner.os }}-podcast-tts-v2-${{ hashFiles('stories/**/*.json', 'build_story.py', 'reviews/**/*.json', 'build_review.py') }}
          restore-keys: |
            ${{ runner.os }}-podcast-tts-v2-
            ${{ runner.os }}-story-tts-v1-

      - name: Build audio, video, feed and page
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build.py

      - name: Validate vocabulary synchronization before publishing
        run: python sync_podcast_vocabulary.py --feed site/feed.xml --dry-run

      - name: Commit built files
        run: |
          git config user.name "podcast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Build podcast audio [skip ci]"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Sync published vocabulary to daily review list
        run: python sync_podcast_vocabulary.py --feed site/feed.xml --commit
