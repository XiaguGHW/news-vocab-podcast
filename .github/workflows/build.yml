name: build podcast

on:
  push:
    branches: [main]
    paths:
      - "episodes/**"
      - "build.py"
      - "video.py"
      - "fonts/**"
      - "cover.png"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and edge-tts
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get install -y -qq --no-install-recommends ffmpeg \
              || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
          fi
          pip install -q edge-tts pillow fonttools

      - name: Check episode scripts
        run: python check_episode.py

      - name: Build audio, video, feed and page
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build.py

      - name: Commit built files
        run: |
          git config user.name "podcast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Build podcast audio [skip ci]"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
